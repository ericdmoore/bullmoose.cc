name: Token doctor

# Read-only diagnostic for BULLMOOSE_RUNTIME_TOKEN.
#
# Exists because the alternative is a guess-fail-guess loop against a live
# account: wrangler reports a missing D1 permission and a missing Workers
# permission with the same generic "Authentication error [code: 10000]", so a
# failed deploy tells you the token is wrong but not WHICH scope is wrong.
#
# Every call here is a GET. It creates nothing, changes nothing, and prints no
# secret — only whether each namespace answers.

on:
  workflow_dispatch:

jobs:
  doctor:
    name: Probe token scopes
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
                   -H "content-type: application/json" "https://api.cloudflare.com/client/v4$1"; }
          ok() { printf '  %-34s %s\n' "$1" "$2"; }

          echo "── is the token itself valid? ─────────────────────────────"
          v=$(api /user/tokens/verify)
          echo "$v" | grep -q '"success":true' \
            && ok "token/verify" "✅ valid ($(echo "$v" | grep -o '"status":"[a-z]*"' | head -1))" \
            || ok "token/verify" "❌ $(echo "$v" | grep -o '"message":"[^"]*"' | head -1)"

          echo
          echo "── which namespaces answer? (GET only) ────────────────────"
          probe() {  # $1 label  $2 path  $3 what-it-implies
            r=$(api "$2")
            if echo "$r" | grep -q '"success":true'; then ok "$1" "✅  $3"
            else
              # Print what Cloudflare actually said. An earlier version grepped
              # only for "code":N and rendered an empty ❌ when the error came
              # back in a different shape — a diagnostic that hides the answer
              # is worse than no diagnostic, because it looks authoritative.
              msg=$(printf '%s' "$r" | tr ',' '\n' | grep -oE '"(code|message)":[^,}]*' | tr '\n' ' ')
              ok "$1" "❌  $3"
              printf '       └─ %s\n' "${msg:-<no parseable error> raw: $(printf '%s' "$r" | head -c 160)}"
            fi
          }

          # Cloudflare's own view of the token, which is the authority when the
          # dashboard summary and the API disagree.
          echo
          echo "── what Cloudflare says this token may do ─────────────────"
          api /user/tokens/verify | tr ',' '\n' | grep -oE '"(id|status)":"[^"]*"' | sed 's/^/  /'
          probe "D1"            "/accounts/$ACCT/d1/database"        "D1:Edit — migrations"
          probe "Workers"       "/accounts/$ACCT/workers/scripts"    "Workers Scripts:Edit — deploys"
          probe "KV"            "/accounts/$ACCT/storage/kv/namespaces" "Workers KV:Edit"
          probe "R2"            "/accounts/$ACCT/r2/buckets"         "Workers R2:Edit"
          probe "Zones"         "/zones?name=bullmoose.cc"           "Zone read — needed to resolve zone_name"

          echo
          echo "── the one that is newly required ─────────────────────────"
          z=$(api "/zones?name=bullmoose.cc" | grep -o '"id":"[0-9a-f]\{32\}"' | head -1 | cut -d'"' -f4)
          if [ -n "$z" ]; then
            probe "Workers Routes" "/zones/$z/workers/routes" "Zone>Workers Routes:Edit — the same-origin app routes"
          else
            ok "Workers Routes" "⚠️  cannot probe — zone id unreadable"
          fi
          echo
          echo "Nothing above was modified. Read-only."
