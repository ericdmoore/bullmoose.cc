name: verify

# Deliberately NOT paths-filtered.
#
# `verify` is a required status check (see .github/rulesets/), and GitHub
# renders a required-but-SKIPPED check as pending forever — so a paths filter
# would make any PR outside the filter permanently unmergeable. The suite is
# ~31 tests in under a second; there is no cost argument for filtering.
#
# `push` is scoped to main, `pull_request` covers everything else. Unscoped,
# BOTH fired for a same-repo branch, so every PR ran this identical job TWICE
# and showed two `verify` rows — double the minutes, and a reviewer left
# wondering which one mattered (2026-08-20: "they look the same"; they were).
# coverage.yml already scopes push this way.
#
# This is NOT the paths-filter hazard above: nothing is skipped. A PR still
# gets exactly one `verify` from `pull_request`, and the job id — the context
# branch protection requires — is unchanged. The one behaviour lost is CI on a
# pushed branch with no PR open yet, which is the cheapest possible thing to
# lose and is restored the moment the PR exists.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job id is the status-check context the branch ruleset requires.
  # DO NOT RENAME IT — a required check is registered by job id, so a rename
  # silently detaches the gate and it stops gating while still looking green.
  # Add new commands as steps here instead; `verify` is meant to grow
  # (lint and fmt land here later) without branch protection ever changing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Platform (TypeScript) ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript's counterpart to the `gofmt -l` and `go vet` gates below.
      # Go had two and TS had none (s06's open item); TS now has both too.
      # `--check` is the `gofmt -l` half: it reports and never rewrites, so CI
      # stays read-only. Both run in well under a second on the whole tree.
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # ── Go CLI ───────────────────────────────────────────────────────────
      # cli-go is its OWN Go module — every Go command runs from `cli-go/`,
      # never `go … ./cli-go`.
      - uses: actions/setup-go@v5
        with:
          # READ FROM go.mod, never a literal here. A version string in this
          # file is a second source of truth that drifts from the `toolchain`
          # pin without anything noticing — and "CI builds one thing, a laptop
          # builds another" is the failure #241 was made of. setup-go honours
          # the `toolchain` directive, so the repo states the version once.
          go-version-file: cli-go/go.mod
          # Anchor setup-go's cache key on go.mod. This comment used to say
          # "cli-go has no third-party deps (no go.sum)" — false since T5:
          # golang.org/x/term, modernc.org/sqlite and (T6) goldmark are all
          # there, each justified in go.mod itself. go.sum exists.
          cache-dependency-path: cli-go/go.mod

      # gofmt is not a test failure, so `go test`/`go vet` never catch it. Fail
      # the build on ANY unformatted file — an empty listing is the pass.
      - name: gofmt
        working-directory: cli-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'gofmt -w cli-go/':"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: cli-go
        run: go vet ./...
      - name: go test
        working-directory: cli-go
        run: go test ./...
      - name: build Go binary
        working-directory: cli-go
        run: go build -o bin/bullmoose .

      # ── popcorn: the SECOND Go module, and it had no CI at all ───────────
      # packages/popcorn is the live SMTP/POP3 submission shim. It was in no
      # job here — not gofmt, not vet, not build — so two files had been
      # sitting unformatted since the Go 1.19 doc-comment reflow and nothing
      # said so. The steps above are scoped `working-directory: cli-go`, which
      # reads like "the Go steps" and is actually "one of the two Go modules".
      #
      # It has no test files today; `go test` is here anyway so the first one
      # added is covered on arrival rather than whenever someone remembers.
      - name: gofmt (popcorn)
        working-directory: packages/popcorn
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'gofmt -w packages/popcorn/':"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (popcorn)
        working-directory: packages/popcorn
        run: go vet ./...
      - name: go test (popcorn)
        working-directory: packages/popcorn
        run: go test ./...
      - name: build popcorn
        working-directory: packages/popcorn
        run: go build ./...

      # ── The contract suite is GONE, and that is the point ────────────────
      # From T2 to the flip, this job ran the 75-case contract suite against
      # BOTH binaries and summarised the native/delegated split — the port's
      # progress metric. The port hit 100%, the Node CLI was removed, and the
      # suite's real job ("the port did not change what the server sees")
      # lives on as cli-go's own choreography tests, which `go test` above
      # already runs. The metric retired with the thing it measured.
