name: verify

# Deliberately NOT paths-filtered.
#
# `verify` is a required status check (see .github/rulesets/), and GitHub
# renders a required-but-SKIPPED check as pending forever — so a paths filter
# would make any PR outside the filter permanently unmergeable. The suite is
# ~31 tests in under a second; there is no cost argument for filtering.
on:
  push:
  pull_request:

jobs:
  # The job id is the status-check context the branch ruleset requires.
  # DO NOT RENAME IT — a required check is registered by job id, so a rename
  # silently detaches the gate and it stops gating while still looking green.
  # Add new commands as steps here instead; `verify` is meant to grow
  # (lint and fmt land here later) without branch protection ever changing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Node CLI + platform (TypeScript) ─────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript's counterpart to the `gofmt -l` and `go vet` gates below.
      # Go had two and TS had none (s06's open item). Lints the whole tree in
      # ~3s, so it costs nothing beside the suite — and it is a LINTER, not a
      # formatter: nothing in this step rewrites a file.
      - run: npm run lint
      - run: npm run typecheck
      # `npm test` includes `src/contract.test.ts`, which runs the contract
      # suite against the Node CLI. The explicit Node pass below re-runs it as a
      # visible, symmetric twin of the Go pass; keeping both keeps the ratchet
      # legible (Node green / Go red is the divergence signal, see below).
      - run: npm test

      # ── Go CLI (the strangler front door) ────────────────────────────────
      # s08 T3 (.plans/s08-go-cli/devPlan.md): the same 61-case contract suite
      # runs against BOTH implementations, in this one required job, so a PR
      # that breaks EITHER fails `verify`. cli-go is its OWN Go module — every
      # Go command runs from `cli-go/`, never `go … ./cli-go`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # cli-go has no third-party deps (no go.sum); anchor setup-go's cache
          # key on go.mod so caching stays valid instead of warning.
          cache-dependency-path: cli-go/go.mod

      # gofmt is not a test failure, so `go test`/`go vet` never catch it. Fail
      # the build on ANY unformatted file — an empty listing is the pass.
      - name: gofmt
        working-directory: cli-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'gofmt -w cli-go/':"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: cli-go
        run: go vet ./...
      - name: go test
        working-directory: cli-go
        run: go test ./...
      - name: build Go binary
        working-directory: cli-go
        run: go build -o bin/bullmoose .

      # ── popcorn: the SECOND Go module, and it had no CI at all ───────────
      # packages/popcorn is the live SMTP/POP3 submission shim. It was in no
      # job here — not gofmt, not vet, not build — so two files had been
      # sitting unformatted since the Go 1.19 doc-comment reflow and nothing
      # said so. The steps above are scoped `working-directory: cli-go`, which
      # reads like "the Go steps" and is actually "one of the two Go modules".
      #
      # It has no test files today; `go test` is here anyway so the first one
      # added is covered on arrival rather than whenever someone remembers.
      - name: gofmt (popcorn)
        working-directory: packages/popcorn
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'gofmt -w packages/popcorn/':"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (popcorn)
        working-directory: packages/popcorn
        run: go vet ./...
      - name: go test (popcorn)
        working-directory: packages/popcorn
        run: go test ./...
      - name: build popcorn
        working-directory: packages/popcorn
        run: go build ./...

      # ── The ratchet: one contract suite, both binaries ───────────────────
      # Node FIRST, then Go, on purpose. If a future port breaks a command, the
      # Node step stays green and the Go step goes red — so the red X sits on
      # "contract suite — Go binary" while its twin is green, and a reviewer
      # reads the divergence directly: the reference passes, the port regressed.
      - name: contract suite — Node CLI (reference, must be 61/0)
        run: npm run -w @bullmoose/cli smoke

      - name: contract suite — Go binary (must be 61/0)
        env:
          BULLMOOSE_CLI_BIN: ${{ github.workspace }}/cli-go/bin/bullmoose
          # Explicit delegation target — never rely on the exe-relative walk in
          # CI (arch.md §4: discovery is explicit, never a silent fallback).
          BULLMOOSE_NODE_CLI: ${{ github.workspace }}/packages/cli/bin/bullmoose.mjs
          # Append-only sink counted below. stderr is uncountable — 20+ contract
          # cases run `2>/dev/null` (documented T2 finding), so the file is the
          # only reliable source for the split.
          BULLMOOSE_TRACE_FILE: ${{ runner.temp }}/bullmoose-trace.log
        run: |
          rm -f "$BULLMOOSE_TRACE_FILE"
          npm run -w @bullmoose/cli smoke

      # ── Port progress, as a number in every run ──────────────────────────
      # `if: always()` so the split still surfaces when the Go pass fails —
      # "how far along is the port" is visible even mid-regression.
      - name: Go port progress (native/delegated split)
        if: always()
        run: |
          trace="${{ runner.temp }}/bullmoose-trace.log"
          if [ ! -f "$trace" ]; then
            echo "No trace file produced (the Go contract pass did not run)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # grep -c exits 1 on zero matches; `|| true` keeps the count, not the
          # exit status, under the shell's `set -e`.
          native="$(grep -c 'bullmoose: native' "$trace" || true)"
          delegated="$(grep -c 'bullmoose: delegated' "$trace" || true)"
          total="$((native + delegated))"
          {
            echo "### Go CLI port progress"
            echo ""
            echo "Contract-suite CLI invocations traced from the Go binary:"
            echo ""
            echo "| disposition | invocations |"
            echo "| --- | ---: |"
            echo "| native | $native |"
            echo "| delegated | $delegated |"
            echo "| **total** | **$total** |"
            if [ "$total" -gt 0 ]; then
              pct="$((native * 100 / total))"
              echo ""
              echo "**${pct}% native** — $native of $total invocations served by Go, the rest delegated to the Node CLI."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
