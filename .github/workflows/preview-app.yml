# A preview URL for every webmail PR.
#
# Why this exists: the app cannot be judged from a diff. Reviewing a change to
# a loading state or a click handler means USING it, and the local path is not
# a substitute — `npm run dev` (infra/localDev.sh) stands the workers up, but
# the browser still has to reach them, and Eric's first attempt 404'd every
# data request. A hosted preview sidesteps the whole question.
#
# It also cannot be done from a laptop: the upload needs an R2-capable token
# and the DNS record needs a zone token, and both exist only as repository
# secrets. CI is where the keys are, so CI is where preview deploys belong.
#
# ## The hostname (#371)
#
# `preview-<pr>.bullmoose.cc`, served by services/webpreview out of the
# `bullmoose-webmail-preview` bucket under a `pr-<n>/` prefix. This replaced a
# *.pages.dev preview when Pages left the stack.
#
# It is ONE level of subdomain on purpose. The nicer `<n>.preview.bullmoose.cc`
# is a multi-level wildcard, and free Universal SSL covers only `*.bullmoose.cc`
# plus the apex — the nested form would serve a cert error on every PR.
#
# ## ⚠️ WHAT A PREVIEW CAN AND CANNOT SHOW — unchanged by the move
#
# The app is same-origin with the JMAP worker by design: the worker answers
# /api/* on app.bullmoose.cc and sends no CORS headers at all (services/jmap
# has no OPTIONS handler; sameOrigin.test.ts pins the arrangement). A preview
# hostname is therefore a DIFFERENT origin with no API behind it, so data
# requests fail and every list stays empty.
#
# That is a SAFETY PROPERTY, not a limitation to fix later. A preview serves
# unreviewed code from a pull request. Adding preview hostnames to the jmap
# routes would make that code same-origin with a credentialed mail API — it
# would run with the reviewer's live session and could read their mail. The
# inconvenience of a preview that cannot show data is the price of previews
# that cannot exfiltrate it.
#
# So a preview is good for chrome, layout, copy, and loading states — the
# skeletons in particular are easy to study, because without data they simply
# stay up. Anything needing a mailbox is checked on app.bullmoose.cc.
name: Preview app

on:
  pull_request:
    paths:
      - "webmail/**"
      - "packages/jmap-core/**"
      - ".github/workflows/preview-app.yml"

# One preview per PR: a new push replaces the running build rather than racing
# it, so the URL in the comment always describes the newest commit.
concurrency:
  group: preview-app-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Forks do not get the deploy secrets, and a run that silently produces no
    # URL is worse than one that never starts.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run -w webmail build
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod
          cache-dependency-path: cli-go/go.sum

      # The same uploader the app and the installer use, pointed at this PR's
      # prefix — see internal/cloud/webmail.go on why this is not a bash loop.
      - name: Upload this PR's build
        working-directory: cli-go
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: go run . cloud webmail push --dir ../webmail/dist --bucket bullmoose-webmail-preview --prefix "pr-${PR}"

      # A worker route binds paths on a hostname that must ALREADY resolve
      # through Cloudflare, so the record is a prerequisite, not decoration.
      # `AAAA 100::` proxied is the discard-prefix placeholder this codebase
      # already uses for worker-served names (cli-go/internal/cloud/plan.go's
      # dnsOurs) — it cannot be anyone's real server, and being proxied is
      # what puts the request on the edge where the worker runs.
      - name: Ensure the preview hostname resolves
        env:
          TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
        run: |
          cf() { curl -sS -m 25 -H "Authorization: Bearer $TOKEN" \
                   -H "content-type: application/json" "$@"; }
          zone=$(cf "https://api.cloudflare.com/client/v4/zones?name=bullmoose.cc" \
                  | tr -d ' \n' | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)
          [ -n "$zone" ] || { echo "::error::could not resolve zone id"; exit 1; }
          recs="https://api.cloudflare.com/client/v4/zones/$zone/dns_records"
          host="preview-${PR}.bullmoose.cc"
          if cf "$recs?name=$host" | tr -d ' \n' | grep -q "\"name\":\"$host\""; then
            echo "$host already resolves"
          else
            r=$(cf -X POST -d "{\"type\":\"AAAA\",\"name\":\"preview-${PR}\",\"content\":\"100::\",\"proxied\":true,\"comment\":\"PR #${PR} preview — removed by preview-cleanup.yml\"}" "$recs")
            printf '%s' "$r" | grep -q '"success":true' \
              && echo "created $host" \
              || { echo "::error::could not create $host"; printf '%s' "$r" | head -c 400; exit 1; }
          fi

      - name: Comment the URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const url = `https://preview-${pr.number}.bullmoose.cc`;
            const marker = "<!-- preview-app -->";
            const body =
              `${marker}\n### Preview\n\n${url}\n\n` +
              "Commit `" + pr.head.sha.slice(0, 7) + "`. " +
              "Updated on every push to this PR; removed when it closes.\n\n" +
              "> **Chrome only.** A preview is a different origin from the API, so " +
              "lists stay empty and data requests fail. That is deliberate: a preview " +
              "runs unreviewed code, and same-origin access to the mail API would mean " +
              "it runs with your live session. Good for layout, copy and loading states " +
              "(the skeletons stay up, which makes them easy to look at). Anything " +
              "needing a mailbox has to be checked on app.bullmoose.cc.";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            // Update in place so a long PR does not accumulate one comment per push.
            const mine = existing.data.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
