name: Deploy mail platform
# Manual-only until the first hand deploy proves the config.
# Requires repo secrets: BULLMOOSE_RUNTIME_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#
# BULLMOOSE_RUNTIME_TOKEN is the RUNTIME half of a deliberate two-token split;
# BULLMOOSE_SITE_DEPLOY_TOKEN (deploy.yml, deploy-app.yml) is the other. They
# are not interchangeable and must not be merged:
#
#   SITE_DEPLOY   Account > Cloudflare Pages:Edit
#                 uploads static files. Blast radius: the website looks wrong.
#   RUNTIME       Workers Scripts:Edit, D1:Edit, Workers KV:Edit,
#                 Workers R2:Edit, AND Zone > Workers Routes:Edit on
#                 bullmoose.cc (needed since services/jmap gained `routes`;
#                 without it the script uploads fine and the ROUTES fail,
#                 which is a confusing place to land).
#                 D1:Edit is arbitrary SQL against the mailstore. Blast
#                 radius: the mail, and everyone's.
#
# The env var below stays CLOUDFLARE_API_TOKEN because that is the name
# wrangler reads; only the SECRET is bullmoose-named, so the privilege level
# is legible at the point of use rather than hidden behind a vendor-generic
# label. deploy-app.yml already maps SITE_DEPLOY the same way.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Order IS the binding graph. Keep in sync with DEPLOY_ORDER in
      # infra/bootstrap.mjs — that file carries the derivation.
      #
      #   submit         no deps
      #   bureau         no deps                   · holds VAULT_MASTER_KEY
      #   jmap           services: submit, bureau  · declares AccountDO
      #   oauth          no deps                   · holds OAUTH_KV
      #   agent          services: submit, bureau, oauth · DO script_name: jmap
      #   ingest         services: AGENT -> agent  · DO script_name: jmap
      #   provision      no deps
      #   anglebrackets  DO script_name: jmap      · serves dav.bullmoose.cc
      #
      # agent BEFORE ingest: services/ingest/wrangler.jsonc:28 binds
      # `bullmoose-agent`. The previous order (submit → jmap → ingest →
      # provision) both skipped agent entirely and had it in the wrong place.
      #
      # bureau BEFORE agent AND jmap: both bind `bullmoose-bureau` (s04 T3a —
      # the credential vault's master key moved there), so the same failure
      # mode sits one edge further up the graph. jmap joined that list in s26
      # T4's surface pass: ProviderCredential/set seals a tenant's provider key
      # over the binding, because VAULT_MASTER_KEY is bound to bureau and to
      # nothing else — least of all to the worker that renders untrusted email.
      - name: Deploy submit
        run: npx wrangler deploy -c services/submit/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy bureau
        run: npx wrangler deploy -c services/bureau/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy jmap
        run: npx wrangler deploy -c services/jmap/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # oauth BEFORE agent: services/agent/wrangler.jsonc:50 binds
      # `OAUTH` as a service, and a service binding to a worker that was
      # never deployed fails the deploy that declares it. Same shape as
      # bureau, and it was missing here while bureau was not — so every
      # services/oauth change merged without CI ever deploying it, and
      # auth.bullmoose.cc ran whatever was last pushed by hand.
      - name: Deploy oauth
        run: npx wrangler deploy -c services/oauth/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy agent
        run: npx wrangler deploy -c services/agent/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy ingest
        run: npx wrangler deploy -c services/ingest/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy provision
        run: npx wrangler deploy -c services/provision/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # anglebrackets serves dav.bullmoose.cc — a live client-facing hostname.
      # Deploying jmap without it moves the AccountDO schema out from under a
      # customer endpoint, and CI used to do exactly that, green.
      - name: Deploy anglebrackets
        run: npx wrangler deploy -c services/anglebrackets/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # webhost LAST: it binds only its own R2 bucket, so nothing waits on
      # it — and it serves app.bullmoose.cc/* UNDERNEATH jmap's more
      # specific routes on that hostname. Deploying it before jmap would
      # open a window where /api/* fell through to the SPA fallback and the
      # app answered its own API calls with HTML.
      - name: Deploy webhost
        run: npx wrangler deploy -c services/webhost/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NOT deployed here: services/demo-keys. It is absent from
      # infra/bootstrap.mjs DEPLOY_ORDER and docs/DEPLOY.md §2 as well —
      # tracked separately as .feedback/fromClaude/infra/013, since wiring it
      # needs its own resource/secret story rather than one more step.
