name: Deploy app

# The bullmoose app surface (webmail/, Astro) at app.bullmoose.cc.
# Plan: .plans/s07-app-surface/devPlan.md.
#
# SERVED FROM R2 (#368/#369/#371). The build is uploaded to the
# `bullmoose-webmail` bucket and served by services/webhost. Cloudflare Pages
# is gone entirely — production here, previews in preview-app.yml — and with
# it the `bullmoose-app` project, its custom-domain attach, and the
# `Cloudflare Pages: Edit` scope on BULLMOOSE_SITE_DEPLOY_TOKEN.
#
# SAME-ORIGIN BY DESIGN. The API is not a separate host: services/jmap owns
# `app.bullmoose.cc/{api/*, auth/*, .well-known/jmap, console/*, share/*}` via
# Worker routes, and webhost serves everything else. Routes match
# most-specific-first, so the two coexist on one name.
#
# That is not a convenience. The alternative — the app on app., the worker on
# api. — makes every request cross-origin, and services/jmap sends NO CORS
# headers and has NO OPTIONS handler (`services/jmap/src/index.ts`), so every
# browser call would die at preflight before reaching the worker. Same-origin
# means there is no CORS surface to get wrong, no preflight latency, and no
# origin boundary for a credential to cross.
#
# The worker ROUTES ship with deploy-mail.yml (BULLMOOSE_RUNTIME_TOKEN), not
# with this workflow. This one only refreshes the bytes they serve.

on:
  push:
    branches: [main]
    paths:
      - "webmail/**"
      - "packages/jmap-core/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The suite gates `main` already, but webmail's own build is the only
      # thing that catches a CSP/hydration break -- `astro build` succeeding
      # while the page renders empty is the s03.C failure mode.
      - run: npm run -w webmail build
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod
          cache-dependency-path: cli-go/go.sum

      # This shells out to the CLI rather than looping `wrangler r2 object
      # put` in bash, because the upload has RULES -- the content-type table,
      # the escaping that keeps `_astro/app.js` two key segments, the refusal
      # to publish a build with no index.html -- and a bash copy would own its
      # own version of each and drift from the installer's silently. One
      # implementation, three front doors (internal/cloud/webmail.go).
      - name: Push the webmail to R2
        working-directory: cli-go
        env:
          # The R2-capable token (the same one release-stack.yml publishes
          # with). BULLMOOSE_SITE_DEPLOY_TOKEN cannot write objects.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: go run . cloud webmail push --dir ../webmail/dist

      # The name must EXIST and be PROXIED for the worker routes to fire at
      # all -- a route binds paths on a hostname that already resolves through
      # Cloudflare. What it points AT is irrelevant, because webhost's
      # `app.bullmoose.cc/*` intercepts every path before anything reaches an
      # origin. So this ensures a placeholder, and never a real target.
      #
      # ⚠️ It also actively REPLACES the old `CNAME app -> bullmoose-app.pages.dev`.
      # With the Pages project deleted, that CNAME dangles: `bullmoose-app.pages.dev`
      # becomes claimable by anyone who creates a project of that name in their
      # own account, and our record would then point at their content. The
      # worker route means nothing would actually serve it today -- but a
      # dangling CNAME to a claimable third-party host is a subdomain takeover
      # waiting for one future route change. `AAAA 100::` is the IPv6 discard
      # prefix: it cannot be anyone's server, ever. (Same shape the installer
      # writes for worker-served names -- cli-go/internal/cloud/plan.go's
      # dnsOurs -- so production and a fresh install now agree.)
      - name: Ensure app.bullmoose.cc resolves to a proxied placeholder
        env:
          TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
        run: |
          cf() { curl -sS -m 25 -H "Authorization: Bearer $TOKEN" \
                   -H "content-type: application/json" "$@"; }
          zone=$(cf "https://api.cloudflare.com/client/v4/zones?name=bullmoose.cc" \
                  | tr -d ' \n' | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)
          [ -n "$zone" ] || { echo "::error::could not resolve zone id for bullmoose.cc"; exit 1; }
          recs="https://api.cloudflare.com/client/v4/zones/$zone/dns_records"
          body='{"type":"AAAA","name":"app","content":"100::","proxied":true,"comment":"s07 app surface — webhost + jmap Worker routes share this origin"}'

          existing=$(cf "$recs?name=app.bullmoose.cc" | tr -d ' \n')
          id=$(printf '%s' "$existing" | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)
          if [ -z "$id" ]; then
            r=$(cf -X POST -d "$body" "$recs")
            printf '%s' "$r" | grep -q '"success":true' \
              && echo "created app.bullmoose.cc -> AAAA 100:: (proxied)" \
              || { echo "::error::could not create the app record"; printf '%s' "$r" | head -c 400; exit 1; }
          elif printf '%s' "$existing" | grep -q '"content":"100::"' && printf '%s' "$existing" | grep -q '"proxied":true'; then
            echo "app.bullmoose.cc is already a proxied placeholder"
          else
            # PUT replaces the record in place, so the name never stops
            # resolving -- a delete-then-create would blink the whole app.
            r=$(cf -X PUT -d "$body" "$recs/$id")
            printf '%s' "$r" | grep -q '"success":true' \
              && echo "replaced the app record with AAAA 100:: (proxied)" \
              || { echo "::error::could not replace the app record"; printf '%s' "$r" | head -c 400; exit 1; }
          fi

          echo "── app.bullmoose.cc ──"
          cf "$recs?name=app.bullmoose.cc" | tr ',' '\n' \
            | grep -oE '"(type|content|proxied)":[^,}]*' | sed 's/^/  /' | head -3
