name: Deploy app

# The bullmoose app surface (webmail/, Astro → Cloudflare Pages) at
# app.bullmoose.cc. Plan: .plans/s07-app-surface/devPlan.md.
#
# SAME-ORIGIN BY DESIGN. The API is not a separate host: services/jmap owns
# `app.bullmoose.cc/{api/*, auth/*, .well-known/jmap, share/*}` via Worker
# routes, and Pages serves everything else. Worker routes take precedence over
# Pages on a shared hostname, so the two coexist on one name.
#
# That is not a convenience. The alternative — Pages on app., the worker on
# api. — makes every request cross-origin, and services/jmap sends NO CORS
# headers and has NO OPTIONS handler (`services/jmap/src/index.ts`), so every
# browser call would die at preflight before reaching the worker. Same-origin
# means there is no CORS surface to get wrong, no preflight latency, and no
# origin boundary for a credential to cross.
#
# Prereqs (one-time, human):
#   1. First run creates the `bullmoose-app` Pages project (direct upload).
#      Then map app.bullmoose.cc to it in the Pages dashboard.
#   2. Reuses BULLMOOSE_SITE_DEPLOY_TOKEN. A token scoped
#      "Account > Cloudflare Pages: Edit" covers every Pages project in the
#      account, so a SECOND project needs no new token and no widening. If a
#      run 403s, that assumption was wrong — widen that one token rather than
#      minting another.
#   3. The Worker routes ship with deploy-mail.yml (BULLMOOSE_RUNTIME_TOKEN),
#      NOT with this workflow. Deploy the worker first, or /api/* 404s into
#      Pages and the app looks broken while the login page works.

on:
  push:
    branches: [main]
    paths:
      - "webmail/**"
      - "packages/jmap-core/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The suite gates `main` already, but webmail's own build is the only
      # thing that catches a CSP/hydration break -- `astro build` succeeding
      # while the page renders empty is the s03.C failure mode.
      - run: npm run -w webmail build
      # `pages deploy` does NOT create a missing project -- it fails with
      # "Maybe you intended to deploy a Worker project instead?", which reads
      # like a config mistake rather than a missing prerequisite. (deploy.yml's
      # comment claims "first run creates the project"; that was true of an
      # older wrangler and is not true now -- corrected there too.) Creating it
      # here keeps the workflow the single source of truth instead of a
      # dashboard step someone has to know about.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_SITE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages project create bullmoose-app \
                  --production-branch=main 2>&1) || true
          echo "$out"
          # Idempotent: a second run is expected to collide, and that is success.
          # Anything else must fail loudly rather than deploying into the dark.
          if echo "$out" | grep -qiE "already exists|8000007"; then
            echo "project already exists — continuing"
          elif echo "$out" | grep -qiE "Successfully created|✨"; then
            echo "project created"
          else
            echo "::error::could not ensure the Pages project exists"; exit 1
          fi

      # Attaching the custom domain is what CREATES the DNS record for
      # app.bullmoose.cc. The Worker routes cannot do it: a `routes` pattern
      # with zone_name binds paths on a hostname that must ALREADY resolve
      # through Cloudflare — unlike `custom_domain: true`, which does provision
      # DNS. Deploy the routes without this and every path returns nothing at
      # all, because the name does not exist. (docs/DEPLOY.md said otherwise;
      # corrected there.)
      #
      # Once the name resolves to Pages, the Worker routes take precedence on
      # their four path patterns and Pages serves the rest — one origin, no CORS.
      - name: Ensure app.bullmoose.cc is attached
        env:
          TOKEN: ${{ secrets.BULLMOOSE_SITE_DEPLOY_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/bullmoose-app/domains"
          # NOTE the whitespace-insensitive match. The first version grepped
          # '"name":"app.bullmoose.cc"' against pretty-printed JSON, never
          # matched, and re-POSTed a domain that was already attached — then
          # treated Cloudflare's "you have already added this" as a failure.
          list=$(curl -sS -m 20 -H "Authorization: Bearer $TOKEN" "$base")
          if printf '%s' "$list" | tr -d ' \n' | grep -q '"name":"app.bullmoose.cc"'; then
            echo "app.bullmoose.cc already attached"
          else
            r=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TOKEN" \
                  -H "content-type: application/json" \
                  -d '{"name":"app.bullmoose.cc"}' "$base")
            # 8000018 = already added. Idempotent runs must treat that as success.
            if printf '%s' "$r" | grep -q '"success":true'; then echo "attached"
            elif printf '%s' "$r" | grep -q '8000018'; then echo "already attached (per API)"
            else echo "::error::could not attach domain"; printf '%s' "$r" | head -c 400; exit 1; fi
          fi

          # Attaching is not the same as SERVING. Pages verifies the domain and
          # provisions DNS asynchronously, and a domain can sit attached with no
          # record — which looks identical from the outside to "never added".
          # Print the status so the difference is visible.
          echo "── custom domain status ──"
          curl -sS -m 20 -H "Authorization: Bearer $TOKEN" "$base" \
            | tr ',' '\n' | grep -oE '"(name|status|verification_data|certificate_authority)":[^,}]*' \
            | sed 's/^/  /' | head -12

      # Pages reports the domain `pending` until a DNS record points at it, and
      # it did not create one — so this closes the loop. Uses the RUNTIME token
      # because DNS:Edit lives there, not on the Pages token.
      #
      # ⚠️ proxied MUST be true. A grey-cloud record resolves straight to the
      # origin and never enters Cloudflare's edge, so the jmap Worker routes
      # would never fire and every /api/* path would fall through to Pages —
      # the same 404-as-HTML failure the routes exist to prevent, arrived at
      # from the other direction.
      - name: Ensure the app DNS record exists
        env:
          TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
        run: |
          cf() { curl -sS -m 25 -H "Authorization: Bearer $TOKEN" \
                   -H "content-type: application/json" "$@"; }
          zone=$(cf "https://api.cloudflare.com/client/v4/zones?name=bullmoose.cc" \
                  | tr -d ' \n' | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)
          [ -n "$zone" ] || { echo "::error::could not resolve zone id for bullmoose.cc"; exit 1; }

          recs="https://api.cloudflare.com/client/v4/zones/$zone/dns_records"
          existing=$(cf "$recs?name=app.bullmoose.cc" | tr -d ' \n')
          if printf '%s' "$existing" | grep -q '"name":"app.bullmoose.cc"'; then
            echo "DNS record already exists:"
            printf '%s' "$existing" | tr ',' '\n' \
              | grep -oE '"(type|content|proxied)":[^,}]*' | sed 's/^/  /' | head -3
          else
            r=$(cf -X POST -d '{"type":"CNAME","name":"app","content":"bullmoose-app.pages.dev","proxied":true,"comment":"s07 app surface — Pages + jmap Worker routes share this origin"}' "$recs")
            printf '%s' "$r" | grep -q '"success":true' \
              && echo "created app.bullmoose.cc → bullmoose-app.pages.dev (proxied)" \
              || { echo "::error::could not create DNS record"; printf '%s' "$r" | head -c 400; exit 1; }
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BULLMOOSE_SITE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webmail/dist --project-name=bullmoose-app --branch=main
