name: Release popcorn

# Popcorn was DEPLOYED BY HAND from the day it existed — the memory that
# outlived three sessions was "merging never updates the running daemon", and
# the running daemon proved it by going stale with security fixes merged and
# unshipped. This workflow ends that class: a `popcorn/v*` tag builds every
# platform, checksums, and publishes to the R2 bucket behind
# https://dl.bullmoose.cc/popcorn/ — where the curl2shell installers
# (install.sh with its one honest prompt, fullmonty.sh without) pick it up.
#
# R2 rather than GitHub releases: dl.bullmoose.cc is the product's own front
# door for `curl | sh`, the latest.txt pointer is ours to flip atomically
# (LAST, after every asset it points at exists), and no GitHub URL shape or
# rate limit is part of the install story.
#
# workflow_dispatch is the DRY RUN: same build, same checksums, uploaded as a
# workflow artifact, nothing published.
#
# RETENTION (bucket lifecycle rules, set 2026-08-23, visible via
# `wrangler r2 bucket lifecycle list bullmoose-downloads`): every published
# version stays online FOREVER — pinning and forensics both want yesterday's
# exact bytes, and a hundred releases is ~$0.15/month. Versioned prefixes
# (popcorn/v*, cli/v*) transition to Infrequent Access after 180 days — R2's
# audit tier: cheaper at rest, still instantly servable, small retrieval fee
# (there is no Glacier-style offline tier on R2; IA is as cold as it gets).
# The hot path (latest.txt, install.sh, fullmonty.sh) is re-uploaded per
# release, which resets its age, so it never transitions. Nothing expires;
# deletion of a published artifact is a deliberate manual act, never policy.

on:
  push:
    tags: ["popcorn/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Cross-compile, checksum, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/popcorn/go.mod

      - name: Tests gate the artifacts
        working-directory: packages/popcorn
        run: |
          gofmt -l . | tee /dev/stderr | wc -l | grep -qx 0
          go vet ./...
          go test ./...

      - name: Cross-compile the matrix
        working-directory: packages/popcorn
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/popcorn/*) VERSION="${GITHUB_REF#refs/tags/popcorn/}" ;;
            *)                   VERSION="dev-${GITHUB_SHA:0:7}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ../../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.releaseVersion=$VERSION" \
              -o "../../dist/popcorn_${VERSION}_${GOOS}_${GOARCH}" ./cmd/popcorn
          done
          # The planner and its templates travel WITH the release, so the
          # installed safety model is the version's own.
          tar -czf "../../dist/deploy.tar.gz" -C . deploy
          ls -l ../../dist

      # The -X stamp is stringly wiring; run the runner's own binary and
      # demand the tag back (the release-cli.yml lesson, verbatim).
      - name: Smoke — the binary knows its version
        run: |
          set -euo pipefail
          out="$(./dist/popcorn_${VERSION}_linux_amd64 version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::version stamp missing — the ldflags -X path broke"; exit 1 ;;
          esac

      - name: Checksums
        working-directory: dist
        run: sha256sum popcorn_* deploy.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish to dl.bullmoose.cc (tags only)
        if: startsWith(github.ref, 'refs/tags/popcorn/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4 >/dev/null 2>&1
          put() { npx wrangler r2 object put "bullmoose-downloads/$1" --file "$2" --remote ${3:+--content-type "$3"}; }
          for f in dist/popcorn_* dist/deploy.tar.gz dist/checksums.txt; do
            put "popcorn/$VERSION/$(basename "$f")" "$f"
          done
          # The installers ride beside the releases, refreshed from THIS tag.
          put "popcorn/install.sh"   packages/popcorn/deploy/bootstrap.sh "text/x-shellscript"
          put "popcorn/fullmonty.sh" packages/popcorn/deploy/fullmonty.sh "text/x-shellscript"
          # latest.txt LAST: the pointer flips only once everything it points
          # at exists — a half-published release is unreachable, not broken.
          printf '%s' "$VERSION" > latest.txt
          put "popcorn/latest.txt" latest.txt "text/plain"
          echo "published: https://dl.bullmoose.cc/popcorn/$VERSION/"

      - name: Upload artifacts (dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/popcorn/') }}
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-${{ env.VERSION }}
          path: dist/
          retention-days: 7
