name: Migrate D1

# Runs `infra/bootstrap.mjs schemas` then `migrate`, in that order.
#
# BOTH, because they do different jobs and neither covers the other:
#   schemas   CREATE TABLE IF NOT EXISTS — adds tables that do not exist yet
#   migrate   the DDL a re-run cannot perform — upgrades tables that DO exist
#
# Running migrate alone assumes the schema is current. On this deployment it
# was not: the live database predated FileNode, so `provenance-columns` died
# with `no such table: file_nodes` after five migrations had already applied.
# A partially-migrated database is exactly what the per-migration `check` makes
# safe to recover from — re-running skips what landed — but the ordering should
# not have needed recovering from in the first place.
# See infra/migrations.mjs for the list and why each entry exists.
#
# SEPARATE from deploy-mail.yml on purpose. Two of these columns
# (accounts.deleted_at, grants.revoked_at) sit in verifyBearer's path, so a
# worker deployed against a database missing them authenticates NOBODY. Running
# migrations as their own step, before any deploy, makes that ordering something
# you do rather than something you remember.
#
# Manual-only. Schema changes should never ride in on a push.
#
# ⚠️ This deliberately runs ONE phase. Never `node infra/bootstrap.mjs` bare
# here: the default is every phase including `secrets`, which on a machine
# without .env.deploy would mint fresh values over the live ones —
# VAULT_MASTER_KEY unrecoverably. bootstrap now refuses that without --rotate,
# and this workflow never gives it the chance.

# The run TITLES itself by mode: a green dry-run used to be indistinguishable
# from a green apply in the run list, which cost a live debugging session (the
# annotations table "migrated" green and did not exist — 2026-08-18). Dispatch
# now APPLIES by default; tick the box for a preview, and either way the run
# name says which one happened.
run-name: "Migrate — ${{ inputs.dry_run == true && 'DRY RUN (nothing applied)' || 'APPLY' }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — print every statement, touch nothing"
        type: boolean
        default: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The round-trip test proves each check actually detects its own absence.
      # If it fails, the migration list disagrees with the schema and nothing
      # should touch a live database until that is understood.
      - run: npx vitest run infra/migrations.test.ts
      - name: Migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BULLMOOSE_RUNTIME_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node infra/bootstrap.mjs schemas --dry-run
            node infra/bootstrap.mjs migrate --dry-run
          else
            # schemas first: every statement is CREATE ... IF NOT EXISTS, so it
            # is safe on a current database and necessary on a stale one.
            # --yes: wrangler prompts before each remote d1 execute, and there is
            # no tty here. The guard that matters is the per-migration `check`,
            # which hard-stops if a statement ran and its check still fails.
            node infra/bootstrap.mjs schemas --yes
            node infra/bootstrap.mjs migrate --yes
          fi
